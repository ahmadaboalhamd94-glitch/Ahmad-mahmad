<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap');

  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface-2: #242424;
    --border: #2a2a2a;
    --text: #f5f5f5;
    --text-2: #b0b0b0;
    --text-3: #666;
    --accent: #3b82f6;
    --accent-2: #22c55e;
    --danger: #ef4444;
    --warning: #f59e0b;
    --radius: 12px;
    --radius-sm: 8px;
    --shadow: 0 4px 24px rgba(0,0,0,0.4);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  img { max-width: 100%; display: block; }

  /* Header */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    position: sticky; top: 0; z-index: 100;
    display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
  }
  .logo {
    display: flex; align-items: center; gap: 10px;
    font-size: 22px; font-weight: 700; color: var(--text);
  }
  .logo-icon {
    width: 38px; height: 38px; background: linear-gradient(135deg, var(--accent), #60a5fa);
    border-radius: 10px; display: flex; align-items: center; justify-content: center;
  }
  .logo-icon svg { width: 22px; height: 22px; color: #fff; }

  .search-wrap {
    flex: 1; max-width: 480px; position: relative;
  }
  .search-wrap input {
    width: 100%; padding: 12px 44px 12px 16px;
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: var(--radius-sm); color: var(--text); font-size: 15px;
    outline: none; transition: border-color 0.2s;
  }
  .search-wrap input:focus { border-color: var(--accent); }
  .search-wrap input::placeholder { color: var(--text-3); }
  .search-wrap svg {
    position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
    color: var(--text-3); width: 20px; height: 20px;
  }

  /* Categories */
  .categories {
    display: flex; gap: 10px; flex-wrap: wrap;
    padding: 20px 24px; max-width: 1400px; margin: 0 auto;
  }
  .cat-btn {
    padding: 8px 18px; border-radius: 20px;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text-2); font-size: 14px; font-weight: 500;
    transition: all 0.2s; white-space: nowrap;
  }
  .cat-btn:hover { background: var(--surface-2); color: var(--text); }
  .cat-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* Main */
  .main { max-width: 1400px; margin: 0 auto; padding: 0 24px 80px; }
  .section-title {
    font-size: 20px; font-weight: 700; margin-bottom: 20px;
    display: flex; align-items: center; gap: 10px;
  }
  .section-title svg { color: var(--accent); }

  /* Grid */
  .laptop-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
  }

  /* Card */
  .laptop-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden;
    transition: transform 0.25s, box-shadow 0.25s;
    cursor: pointer; position: relative;
  }
  .laptop-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow);
    border-color: #333;
  }
  .card-img-wrap { position: relative; height: 200px; overflow: hidden; background: var(--surface-2); }
  .card-img-wrap img {
    width: 100%; height: 100%; object-fit: cover;
    transition: transform 0.4s;
  }
  .laptop-card:hover .card-img-wrap img { transform: scale(1.05); }
  .img-count {
    position: absolute; top: 10px; right: 10px;
    background: rgba(0,0,0,0.7); color: #fff;
    font-size: 12px; padding: 4px 10px; border-radius: 6px;
    backdrop-filter: blur(4px);
  }
  .compare-btn {
    position: absolute; top: 10px; left: 10px;
    width: 34px; height: 34px; border-radius: 8px;
    background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
    border: 1px solid rgba(255,255,255,0.1);
    display: flex; align-items: center; justify-content: center;
    color: #fff; opacity: 0; transition: opacity 0.2s;
  }
  .laptop-card:hover .compare-btn { opacity: 1; }
  .compare-btn.selected {
    opacity: 1; background: var(--accent); border-color: var(--accent);
  }
  .compare-btn svg { width: 18px; height: 18px; }

  .card-body { padding: 16px; }
  .card-name { font-size: 16px; font-weight: 700; margin-bottom: 4px; line-height: 1.4; }
  .card-brand { font-size: 13px; color: var(--text-3); margin-bottom: 12px; }
  .card-specs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .spec-tag {
    font-size: 12px; padding: 3px 10px;
    background: var(--surface-2); border-radius: 6px;
    color: var(--text-2); border: 1px solid var(--border);
  }
  .card-footer {
    display: flex; align-items: center; justify-content: space-between;
    padding-top: 12px; border-top: 1px solid var(--border);
  }
  .card-price { font-size: 18px; font-weight: 700; color: var(--accent-2); }
  .card-rating { display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--text-2); }
  .star { color: #fbbf24; }

  /* Detail View */
  .detail-view { display: none; padding: 24px; max-width: 1200px; margin: 0 auto; }
  .detail-view.active { display: block; }
  .back-btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 20px; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    color: var(--text-2); font-size: 14px; font-weight: 500;
    transition: all 0.2s; margin-bottom: 24px;
  }
  .back-btn:hover { background: var(--surface-2); color: var(--text); }
  .back-btn svg { width: 18px; height: 18px; }

  .detail-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 32px;
  }
  @media (max-width: 768px) { .detail-grid { grid-template-columns: 1fr; } }

  /* Gallery */
  .gallery-main {
    width: 100%; height: 380px; object-fit: cover;
    border-radius: var(--radius); background: var(--surface-2);
    margin-bottom: 12px;
  }
  .gallery-thumbs {
    display: flex; gap: 10px; overflow-x: auto;
    padding-bottom: 4px;
  }
  .gallery-thumb {
    width: 80px; height: 60px; object-fit: cover;
    border-radius: 8px; border: 2px solid transparent;
    cursor: pointer; flex-shrink: 0; background: var(--surface-2);
    transition: border-color 0.2s;
  }
  .gallery-thumb.active { border-color: var(--accent); }
  .gallery-thumb:hover { border-color: var(--text-3); }

  .detail-info h1 { font-size: 26px; font-weight: 700; margin-bottom: 6px; }
  .detail-sub { color: var(--text-3); font-size: 15px; margin-bottom: 20px; }
  .detail-price-big { font-size: 32px; font-weight: 700; color: var(--accent-2); margin-bottom: 16px; }
  .detail-rating-row {
    display: flex; align-items: center; gap: 12px; margin-bottom: 24px;
  }
  .detail-rating-row .stars { font-size: 20px; }
  .detail-rating-row .score { font-size: 20px; font-weight: 700; }
  .rating-progress {
    width: 140px; height: 6px; background: var(--surface-2);
    border-radius: 3px; overflow: hidden;
  }
  .rating-progress-fill { height: 100%; background: #fbbf24; border-radius: 3px; }

  .specs-list { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .spec-row {
    display: flex; justify-content: space-between;
    padding: 14px 18px; border-bottom: 1px solid var(--border);
    font-size: 14px;
  }
  .spec-row:last-child { border-bottom: none; }
  .spec-row .spec-label { color: var(--text-3); }
  .spec-row .spec-value { font-weight: 600; color: var(--text); }

  /* Compare */
  .compare-view { display: none; padding: 24px; max-width: 1200px; margin: 0 auto; }
  .compare-view.active { display: block; }
  .compare-grid-2 {
    display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
  }
  @media (max-width: 768px) { .compare-grid-2 { grid-template-columns: 1fr; } }
  .compare-card-full {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden;
  }
  .compare-card-full img { width: 100%; height: 220px; object-fit: cover; background: var(--surface-2); }
  .compare-card-body { padding: 20px; }
  .compare-card-body h3 { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
  .compare-card-body .brand { color: var(--text-3); font-size: 14px; margin-bottom: 12px; }
  .compare-card-body .price { font-size: 24px; font-weight: 700; color: var(--accent-2); margin-bottom: 16px; }
  .compare-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .compare-row .label { color: var(--text-3); }
  .compare-row .value { font-weight: 600; }

  /* Compare Bar */
  .compare-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--surface); border-top: 1px solid var(--border);
    padding: 14px 24px; display: none; align-items: center;
    justify-content: space-between; z-index: 200;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.3);
  }
  .compare-bar.show { display: flex; }
  .compare-bar-text { font-size: 15px; }
  .compare-bar-text strong { color: var(--accent); }
  .compare-bar-actions { display: flex; gap: 10px; }
  .btn { padding: 10px 24px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600; transition: all 0.2s; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #2563eb; }
  .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-2); }
  .btn-ghost:hover { background: var(--surface-2); color: var(--text); }

  .empty-state {
    text-align: center; padding: 80px 20px; color: var(--text-3);
  }
  .empty-state svg { width: 64px; height: 64px; margin-bottom: 16px; opacity: 0.3; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #444; }
</style>

// ═══════════════════════════════════════════════════════════════
//  المنطق التفاعلي
// ═══════════════════════════════════════════════════════════════
let selectedCategory = 'all';
let compareList = [];

function renderStars(rating) {
  const full = Math.floor(rating / 2);
  let html = '';
  for (let i = 0; i < 5; i++) {
    html += i < full ? '<span class="star">★</span>' : '<span style="color:#333">★</span>';
  }
  return html;
}

function getCategoryLabel(cat) {
  const map = { gaming: 'ألعاب', ultrabook: 'ألترابوك', workstation: 'محطة عمل', student: 'طلاب', creative: 'إبداعي' };
  return map[cat] || cat;
}

function getCategoryIcon(cat) {
  const map = { gaming: '🎮', ultrabook: '💻', workstation: '⚙️', student: '🎓', creative: '🎨' };
  return map[cat] || '💻';
}

function renderLaptops() {
  const grid = document.getElementById('laptopGrid');
  const search = document.getElementById('searchInput').value.toLowerCase().trim();
  const filtered = laptops.filter(l => {
    const matchCat = selectedCategory === 'all' || l.category === selectedCategory;
    const matchSearch = !search || l.name.toLowerCase().includes(search) || l.brand.toLowerCase().includes(search);
    return matchCat && matchSearch;
  });

  document.getElementById('emptyState').style.display = filtered.length ? 'none' : 'flex';

  grid.innerHTML = filtered.map(l => `
    <div class="laptop-card" onclick="showDetail(${l.id})">
      <button class="compare-btn ${compareList.includes(l.id) ? 'selected' : ''}"
        onclick="event.stopPropagation(); toggleCompare(${l.id})" title="أضف للمقارنة">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </button>
      ${l.imgs.length > 1 ? `<div class="img-count">${l.imgs.length} صور</div>` : ''}
      <div class="card-img-wrap">
        <img src="${l.imgs[0]}" alt="${l.name}" loading="lazy"
          onerror="this.src='https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=600&h=400&fit=crop'">
      </div>
      <div class="card-body">
        <div class="card-name">${l.name}</div>
        <div class="card-brand">${getCategoryIcon(l.category)} ${l.brand} · ${getCategoryLabel(l.category)}</div>
        <div class="card-specs">
          <span class="spec-tag">${l.cpu.split(' ').slice(0, 3).join(' ')}</span>
          <span class="spec-tag">${l.ram}</span>
          <span class="spec-tag">${l.screen.split(' ')[0]}</span>
        </div>
        <div class="card-footer">
          <div class="card-price">${l.price.toLocaleString()} ج.م</div>
          <div class="card-rating">${renderStars(l.rating)} ${l.rating}</div>
        </div>
      </div>
    </div>
  `).join('');
}

function setCategory(cat) {
  selectedCategory = cat;
  document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
  event.target.classList.add('active');
  renderLaptops();
}

function filterLaptops() { renderLaptops(); }

// ─── Detail View ───
function showDetail(id) {
  const l = laptops.find(x => x.id === id);
  if (!l) return;
  document.getElementById('homeView').style.display = 'none';
  document.getElementById('detailView').classList.add('active');
  document.getElementById('compareView').classList.remove('active');
  window.scrollTo(0, 0);

  const thumbs = l.imgs.map((img, i) =>
    `<img class="gallery-thumb ${i === 0 ? 'active' : ''}" src="${img}" onclick="setGallery(${i}, ${l.id})" alt="">`
  ).join('');

  document.getElementById('detailContent').innerHTML = `
    <div>
      <img class="gallery-main" id="galleryMain" src="${l.imgs[0]}" alt="${l.name}"
        onerror="this.src='https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=800&h=600&fit=crop'">
      <div class="gallery-thumbs">${thumbs}</div>
    </div>
    <div class="detail-info">
      <h1>${l.name}</h1>
      <div class="detail-sub">${getCategoryIcon(l.category)} ${l.brand} · ${getCategoryLabel(l.category)}</div>
      <div class="detail-price-big">${l.price.toLocaleString()} ج.م</div>
      <div class="detail-rating-row">
        <span class="stars">${renderStars(l.rating)}</span>
        <span class="score">${l.rating}</span>
        <span style="color:var(--text-3)">/ 10</span>
        <div class="rating-progress"><div class="rating-progress-fill" style="width:${l.rating * 10}%"></div></div>
      </div>
      <div class="specs-list">
        <div class="spec-row"><span class="spec-label">المعالج</span><span class="spec-value">${l.cpu}</span></div>
        <div class="spec-row"><span class="spec-label">الرام</span><span class="spec-value">${l.ram}</span></div>
        <div class="spec-row"><span class="spec-label">التخزين</span><span class="spec-value">${l.storage}</span></div>
        <div class="spec-row"><span class="spec-label">كرت الشاشة</span><span class="spec-value">${l.gpu}</span></div>
        <div class="spec-row"><span class="spec-label">الشاشة</span><span class="spec-value">${l.screen}</span></div>
        <div class="spec-row"><span class="spec-label">البطارية</span><span class="spec-value">${l.battery}</span></div>
        <div class="spec-row"><span class="spec-label">الوزن</span><span class="spec-value">${l.weight}</span></div>
        <div class="spec-row"><span class="spec-label">المداخل</span><span class="spec-value">${l.ports}</span></div>
        <div class="spec-row"><span class="spec-label">نظام التشغيل</span><span class="spec-value">${l.os}</span></div>
      </div>
    </div>
  `;
}

function setGallery(idx, id) {
  const l = laptops.find(x => x.id === id);
  document.getElementById('galleryMain').src = l.imgs[idx];
  document.querySelectorAll('.gallery-thumb').forEach((t, i) => t.classList.toggle('active', i === idx));
}

function showHome() {
  document.getElementById('homeView').style.display = 'block';
  document.getElementById('detailView').classList.remove('active');
  document.getElementById('compareView').classList.remove('active');
  window.scrollTo(0, 0);
}

// ─── Compare ───
function toggleCompare(id) {
  if (compareList.includes(id)) {
    compareList = compareList.filter(x => x !== id);
  } else {
    if (compareList.length >= 2) { alert('يمكنك مقارنة جهازين فقط في الوقت الحالي'); return; }
    compareList.push(id);
  }
  updateCompareBar();
  renderLaptops();
}

function updateCompareBar() {
  const bar = document.getElementById('compareBar');
  document.getElementById('compareCount').textContent = compareList.length;
  bar.classList.toggle('show', compareList.length > 0);
}

function clearCompare() { compareList = []; updateCompareBar(); renderLaptops(); }

function showCompare() {
  if (compareList.length < 2) return;
  const a = laptops.find(x => x.id === compareList[0]);
  const b = laptops.find(x => x.id === compareList[1]);
  document.getElementById('homeView').style.display = 'none';
  document.getElementById('detailView').classList.remove('active');
  document.getElementById('compareView').classList.add('active');
  window.scrollTo(0, 0);

  const specs = [
    { key: 'price', label: 'السعر', fmt: v => v.toLocaleString() + ' ج.م' },
    { key: 'rating', label: 'التقييم', fmt: v => v + '/10' },
    { key: 'cpu', label: 'المعالج', fmt: v => v },
    { key: 'ram', label: 'الرام', fmt: v => v },
    { key: 'storage', label: 'التخزين', fmt: v => v },
    { key: 'gpu', label: 'كرت الشاشة', fmt: v => v },
    { key: 'screen', label: 'الشاشة', fmt: v => v },
    { key: 'battery', label: 'البطارية', fmt: v => v },
    { key: 'weight', label: 'الوزن', fmt: v => v },
    { key: 'ports', label: 'المداخل', fmt: v => v },
    { key: 'os', label: 'نظام التشغيل', fmt: v => v },
  ];

  document.getElementById('compareGrid').innerHTML = [a, b].map(l => `
    <div class="compare-card-full">
      <img src="${l.imgs[0]}" alt="${l.name}"
        onerror="this.src='https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=800&h=600&fit=crop'">
      <div class="compare-card-body">
        <h3>${l.name}</h3>
        <div class="brand">${l.brand}</div>
        <div class="price">${l.price.toLocaleString()} ج.م</div>
        ${specs.map(s => `
          <div class="compare-row">
            <span class="label">${s.label}</span>
            <span class="value">${s.fmt(l[s.key])}</span>
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');
}

// Init
renderLaptops();
</script>
